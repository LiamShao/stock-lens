name: stocklens-ai

services:
  postgres:
    build:
      context: ./docker/postgres
    image: stocklens-postgres:16-pgvector
    container_name: stocklens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocklens_ai}
      POSTGRES_USER: ${POSTGRES_USER:-stocklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocklens-dev-password}
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: stocklens-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stocklens-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stocklens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stocklens-dev-password}
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
